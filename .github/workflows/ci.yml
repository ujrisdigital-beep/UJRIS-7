name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: clean-checkout-validation
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./test.db
      AUTH_SECRET: ci-test-auth-secret-not-for-production-use
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:4127
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Typecheck (typegen + tsc; no prior build)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Security tests
        run: npm run test:security
      - name: Integration tests
        run: npm run test:integration
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E with managed server
        run: npm run test:e2e
      - name: Production build
        run: npm run build
      - name: Surface npm audit (visibility; non-gating)
        run: npm audit --json > docs/audits/npm-audit.last.json || true
      - name: Runtime dependency security gate
        run: npm run test:audit-policy
      - name: Upload evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: step2a-ci-evidence
          path: |
            docs/audits/npm-audit.last.json
            docs/audits/dependency-policy-last.json
            playwright-report
            test-results
          if-no-files-found: warn
